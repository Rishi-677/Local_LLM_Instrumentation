name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
  # Manual trigger so the heavy sidecar e2e job can be run on demand.
  workflow_dispatch:

jobs:
  build-test-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        # libcurl4-openssl-dev is intentionally omitted: LLAMA_CURL is OFF.
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build g++

      # ccache greatly speeds up repeated CI runs. The FIRST build is slow
      # because it compiles llama.cpp from source via CMake FetchContent;
      # ccache lets subsequent runs reuse those object files.
      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: ${{ github.job }}-ubuntu-latest

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DLOCAL_LLM_INSTRUMENTATION_BUILD_TESTS=ON

      - name: Build local_llm_instrumentation
        run: cmake --build build --target local_llm_instrumentation

      # The unit-test target name may vary (tests / unit_tests); ctest builds
      # and runs whatever tests CTest knows about, so it is the safe choice.
      - name: Test
        run: cd build && ctest --output-on-failure

  # Windows build with the project's primary toolchain: MinGW-w64 UCRT64 + Ninja
  # (matches the local dev setup; the link is static via -fopenmp -static).
  build-test-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSYS2 (UCRT64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-ccache

      # Cache ccache across runs so the slow first llama.cpp compile is reused.
      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-windows-ucrt64-${{ github.run_id }}
          restore-keys: |
            ccache-windows-ucrt64-

      - name: Configure
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
        run: >-
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DLOCAL_LLM_INSTRUMENTATION_BUILD_TESTS=ON
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build local_llm_instrumentation
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
        run: cmake --build build --target local_llm_instrumentation

      - name: Test
        run: cd build && ctest --output-on-failure

  # PyTorch sidecar end-to-end. Gated: torch+transformers is a heavy install, so
  # this runs only on manual dispatch or pushes to main, not on every branch push.
  sidecar-e2e:
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build g++

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: ${{ github.job }}-ubuntu-latest

      - name: Build local_llm_instrumentation
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target local_llm_instrumentation

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # CPU-only torch keeps the install small; the e2e test does not need TF.
      - name: Install Python sidecar deps (CPU)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install "transformers>=4.30.0" "numpy>=1.24.0"

      - name: Run sidecar e2e
        run: python tests/test_sidecar_e2e.py
